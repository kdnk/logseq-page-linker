name: Build release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package plugin
        run: zip -r dist.zip index.html package.json README.md LICENSE dist assets/icon.png docs/page-linker-demo.gif
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            gh release upload "$RELEASE_TAG" dist.zip --repo "$GITHUB_REPOSITORY" --clobber
            if [ "$draft" = true ]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" dist.zip --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
